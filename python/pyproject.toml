[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secure-keystore"
version = "1.0.0"
description = "Encrypted secrets at rest for Python, with no service to run. Two-layer AES-256-GCM over PBKDF2-SHA256 and HKDF-SHA256, with a documented cross-language format."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ejaz Hussain Arain", email = "hello@tech-style.co" }]
maintainers = [{ name = "Tech Style Ltd", email = "hello@tech-style.co" }]
keywords = [
    "encryption", "secrets", "secret-management", "keystore", "credentials",
    "vault", "aes-gcm", "pbkdf2", "hkdf", "dotenv", "configuration",
    "encryption-at-rest", "devops", "ci-cd",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["cryptography>=41.0"]

[project.urls]
Homepage = "https://tech-style.co/"
Repository = "https://github.com/eharain/secure-keystore"
Issues = "https://github.com/eharain/secure-keystore/issues"
Changelog = "https://github.com/eharain/secure-keystore/blob/main/python/CHANGELOG.md"

[project.scripts]
secure-keystore = "secure_keystore.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/secure_keystore"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
